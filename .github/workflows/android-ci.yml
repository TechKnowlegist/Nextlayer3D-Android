name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Ubuntu, not macOS — Gradle/Android tooling runs natively here, so this
    # is far simpler (and cheaper) than the iOS CI's Xcode juggling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle wrapper is checked in (see README for why), so this needs
      # to actually provision Gradle itself rather than its default
      # behavior of just optimizing an existing ./gradlew.
      # AGP 8.13.0 (bumped to pick up a newer R8 - see root build.gradle.kts)
      # requires Gradle 8.13 minimum; using the latest 8.14.x patch for the
      # bug fixes on top of that floor without jumping to the Gradle 9 line.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
